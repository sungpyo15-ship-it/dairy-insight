name: 공식 데이터 자동 수집

on:
  schedule:
    - cron: "23 1 * * *"   # 매일 10:23 KST
  workflow_dispatch: {}     # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["data/upload/**"]  # 유대 정산 기준 엑셀을 올리면 바로 반영

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OCR 도구 설치 (KREI 보고서 판독용)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-kor
          pip install -q pillow openpyxl
      - name: 수집 실행
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collector/collect.py
      - name: 변경분 커밋
        run: |
          git config user.name "dairy-insight-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
